<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANDAHA — Parsamina & Luxury Textile Business Portal</title>
  <style>
    @font-face {
      font-family: 'SF Pro';
      src: local('SF Pro Text'), local('SF Pro Display'), local('SFPro-Regular');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'SF Pro';
      src: local('SF Pro Text Bold'), local('SF Pro Display Bold'), local('SFPro-Bold');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'SF Pro Thin';
      src: local('SF Pro Text Thin'), local('SF Pro Display Thin'), local('SFPro-Thin');
      font-weight: 100;
      font-style: normal;
    }
    @font-face {
      font-family: 'Aalto';
      src: local('Aalto'), local('Arial Narrow');
      font-weight: 400;
      font-style: normal;
    }

    :root {
      font-family: 'SF Pro', Arial, sans-serif;
      color: #fff;
      background: #080706;
      font-synthesis: none;
      --gold-primary: #D4AF37;
      --gold-light: #F3E5AB;
      --crimson-accent: #8B0000;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }

    .experience {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 540px;
      overflow: hidden;
      background: #080706;
    }

    .backgrounds, .background, .shade, .transition-layer, .transition-layer video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .background {
      object-fit: cover;
      opacity: 0;
      transition: opacity .8s ease;
      filter: brightness(0.65) contrast(1.1);
    }
    .background.is-visible { opacity: 1; }

    .shade {
      z-index: 1;
      background: linear-gradient(to bottom, rgba(8,7,6,0.3) 0%, transparent 40%, rgba(8,7,6,0.92) 100%);
      pointer-events: none;
    }

    .chrome {
      position: absolute;
      z-index: 4;
      transition: opacity .45s ease, filter .45s ease;
    }
    .experience.is-transitioning .chrome {
      opacity: 0;
      filter: blur(8px);
      pointer-events: none;
    }

    /* HEADER */
    .header {
      left: clamp(18px, 1.95vw, 28px);
      right: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title {
      display: flex;
      flex-direction: column;
      margin-left: 52px;
      line-height: 1;
    }
    .brand-name {
      font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--gold-primary);
      text-transform: uppercase;
    }
    .brand-sub {
      font-size: 9px;
      letter-spacing: 0.35em;
      color: rgba(255,255,255,0.6);
      margin-top: 3px;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .nav {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 4px 6px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      background: rgba(10, 8, 6, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 999px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .nav a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 999px;
      line-height: 1;
      font-size: 13px;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
    }
    .nav a.active, .nav a:hover {
      background: var(--gold-primary);
      color: #000;
      font-weight: 700;
    }
    .menu {
      height: 42px;
      padding: 0 22px;
      border: 1px solid var(--gold-primary);
      border-radius: 999px;
      background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
      color: #000;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(212,175,55,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .menu:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 20px rgba(212,175,55,0.5);
    }

    /* SIDEBAR CATEGORIES */
    .planet-list {
      left: clamp(18px, 1.95vw, 28px);
      top: 50%;
      transform: translateY(-43%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 15px;
    }
    .planet-item {
      display: flex;
      align-items: center;
      min-height: 24px;
      opacity: 0.5;
      cursor: pointer;
      transition: opacity 0.3s ease, transform 0.3s ease;
      letter-spacing: 0.06em;
    }
    .planet-item:hover {
      opacity: 0.85;
      transform: translateX(4px);
    }
    .planet-item.active {
      font-size: 17px;
      font-weight: 700;
      gap: 10px;
      opacity: 1;
      color: var(--gold-light);
    }
    .planet-item.active:before {
      content: '';
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gold-primary);
      box-shadow: 0 0 10px var(--gold-primary);
      flex-shrink: 0;
    }

    /* PORTAL */
    .portal-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(340px, 32vw);
      transform: translate(-50%, -54%);
      perspective: none;
    }
    .portal-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 15px;
      opacity: 0;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.08em;
    }
    .portal-heading strong {
      font-size: 17px;
      margin-left: 8px;
      color: var(--gold-primary);
    }
    .portal {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 320 / 360;
      padding: 0;
      overflow: visible;
      border: 0;
      border-radius: 90px;
      background: transparent;
      cursor: pointer;
      box-shadow: none;
      transform: none !important;
    }
    .portal video, .portal img {
      visibility: hidden;
      position: absolute;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .portal-canvas {
      position: fixed;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* CONTENT */
    .planet-content {
      position: absolute;
      left: clamp(28px, 4vw, 58px);
      right: clamp(28px, 3vw, 44px);
      bottom: clamp(24px, 3vh, 30px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
    }
    .category-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--gold-primary);
      text-transform: uppercase;
      margin-bottom: 8px;
      padding: 4px 12px;
      background: rgba(212,175,55,0.12);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 4px;
    }
    .planet-content h1 {
      font-family: Aalto, 'Arial Narrow', sans-serif;
      font-size: clamp(96px, 18vw, 240px);
      font-weight: 400;
      line-height: .75;
      margin: 0 0 -.04em;
      letter-spacing: -0.01em;
      transform: translateX(-32px);
      opacity: 0;
      background: linear-gradient(180deg, #FFFFFF 30%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .planet-content dl {
      width: min(460px, 35vw);
      margin: 0;
      font-size: 15px;
      background: rgba(10,8,6,0.65);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(212,175,55,0.25);
      backdrop-filter: blur(12px);
    }
    .fact {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 16px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(212,175,55,0.2);
      opacity: 0;
    }
    .fact:last-child { border-bottom: 0; }
    .fact dt { font-weight: 700; color: var(--gold-light); }
    .fact dd { margin: 0; color: rgba(255,255,255,0.88); line-height: 1.35; }

    /* MISC & SCENE CANVAS */
    .scene-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: none;
      pointer-events: none;
    }
    .transition-layer { display: none; }
    .loading {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      opacity: 0;
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold-primary);
      transition: opacity .2s;
      pointer-events: none;
    }
    .experience.is-loading .loading { opacity: .9; }
    .experience.is-transitioning .header,
    .experience.is-transitioning .planet-list {
      opacity: 1;
      filter: none;
      pointer-events: auto;
    }
    .experience.is-transitioning .shade { opacity: 1; }
    .experience.is-committing .background { transition: none !important; }

    /* PRELOADER */
    .preloader {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #080706;
      overflow: hidden;
    }
    .preloader video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.7) contrast(1.15);
    }
    .preloader-shade {
      position: absolute;
      inset: auto 0 0;
      height: 40%;
      background: linear-gradient(to bottom, transparent, #080706);
    }
    .preloader-subtext {
      position: absolute;
      left: 50%;
      bottom: clamp(100px, 16vh, 140px);
      transform: translateX(-50%);
      font-size: clamp(16px, 2vw, 22px);
      font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
      letter-spacing: 0.15em;
      color: var(--gold-light);
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 4px 15px rgba(0,0,0,0.9);
      transition: opacity 0.5s ease;
    }

    .preloader.is-background { z-index: 0; }
    .preloader.is-background .preloader-shade,
    .preloader.is-background .preloader-subtext { opacity: 0; }

    .floating-logo {
      position: fixed;
      z-index: 22;
      left: 50%;
      top: 50%;
      width: 64px;
      height: 64px;
      transform: translate(-50%, -50%);
      will-change: left, top, width, height, transform;
      transition: left 2s cubic-bezier(.16, 1, .3, 1),
                  top 2s cubic-bezier(.16, 1, .3, 1),
                  width 2s cubic-bezier(.16, 1, .3, 1),
                  height 2s cubic-bezier(.16, 1, .3, 1),
                  transform 2s cubic-bezier(.16, 1, .3, 1);
      filter: drop-shadow(0 0 12px rgba(212,175,55,0.6));
    }
    .floating-logo.is-docked {
      left: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      width: 42px;
      height: 42px;
      transform: none;
    }
    .floating-logo.is-settled { z-index: 5; }

    .preloader-count {
      position: fixed;
      z-index: 22;
      left: 50%;
      bottom: clamp(22px, 3.1vh, 28px);
      display: flex;
      align-items: flex-end;
      gap: 4px;
      transform: translateX(-50%);
      font-family: 'SF Pro', Arial, sans-serif;
      line-height: 1;
    }
    .preloader-count > span:first-child {
      font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
      font-size: 64px;
      font-weight: 100;
      color: var(--gold-primary);
    }
    .preloader-count .percent {
      font-size: 24px;
      padding-bottom: 4px;
      color: var(--gold-light);
    }
    .preloader-count.is-leaving {
      animation: preload-count-out .75s cubic-bezier(.22, 1, .36, 1) both;
    }
    @keyframes preload-count-out {
      to { opacity: 0; filter: blur(7px); transform: translate(-50%, -34px); }
    }

    body:not(.preload-complete) .custom-cursor { opacity: 0 !important; }

    /* CUSTOM CURSOR */
    html, body, button, a, .portal { cursor: none !important; }
    .custom-cursor {
      display: block;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      width: 1px;
      height: 1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .custom-cursor.is-visible { opacity: 1; }
    .cursor-dot, .cursor-orbit {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .cursor-dot {
      width: 10px;
      height: 10px;
      background: var(--gold-primary);
      box-shadow: 0 0 10px var(--gold-primary);
    }
    .cursor-orbit {
      width: 38px;
      height: 38px;
      border: 1px solid var(--gold-primary);
      background: rgba(212, 175, 55, 0.15);
      transition: transform .3s cubic-bezier(.22, 1, .36, 1);
    }
    .custom-cursor.is-enter .cursor-orbit {
      transform: translate(-50%, -50%) scale(1.22);
      border-color: #FFF;
      background: rgba(255, 255, 255, 0.25);
    }
    .cursor-label {
      position: absolute;
      top: 26px;
      left: 0;
      transform: translateX(-50%) translateY(-4px);
      font: 14px/1.2 'SF Pro', Arial, sans-serif;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .2s ease, transform .3s cubic-bezier(.22, 1, .36, 1);
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    .custom-cursor.is-enter .cursor-label {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ENTRANCE / SWITCH ANIMATIONS */
    body:not(.intro-ready) .header,
    body:not(.intro-ready) .planet-list,
    body:not(.intro-ready) .planet-content h1,
    body:not(.intro-ready) .planet-content .fact { opacity: 0; }

    .intro-ready .header { animation: reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both; }
    .intro-ready .planet-list { animation: reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both; }
    .content-revealing h1 { animation: title-rise 1.05s cubic-bezier(.16,1,.3,1) both; }
    .content-revealing .fact { animation: fact-rise .72s cubic-bezier(.22,1,.36,1) both; }

    .content-revealing .fact:nth-child(1) { animation-delay: .52s; }
    .content-revealing .fact:nth-child(2) { animation-delay: .68s; }
    .content-revealing .fact:nth-child(3) { animation-delay: .84s; }
    .content-revealing .fact:nth-child(4) { animation-delay: 1.00s; }

    .mask-revealing .portal-heading { animation: portal-caption .85s cubic-bezier(.22,1,.36,1) both; }
    .planet-list.is-switching .planet-item { animation: menu-row .58s cubic-bezier(.22,1,.36,1) both; }

    .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
    .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
    .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
    .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }

    .planet-list.is-switching .planet-item.active:before { animation: active-dot .55s cubic-bezier(.22,1,.36,1) .18s both; }

    @keyframes reveal-down {
      from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes reveal-side {
      from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }
      to { opacity: 1; filter: blur(0); transform: translate(0, -43%); }
    }
    @keyframes title-rise {
      from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); }
      to { opacity: 1; filter: blur(0); transform: translate(-32px, 0); }
    }
    @keyframes fact-rise {
      from { opacity: 0; filter: blur(7px); transform: translateY(18px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes portal-caption {
      from { opacity: 0; filter: blur(7px); transform: translateY(22px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes menu-row {
      from { opacity: .35; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes active-dot {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: scale(1); }
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .nav { display: none; }
      .portal-wrap { width: min(300px, 48vw); }
      .planet-content h1 { font-size: clamp(80px, 20vw, 160px); }
      .planet-content dl { width: 44vw; font-size: 13px; }
      .fact { grid-template-columns: 110px 1fr; }
      .planet-list { font-size: 14px; }
      .planet-item.active { font-size: 15px; }
      .brand-title { margin-left: 44px; }
    }
    @media (max-width: 640px) {
      .experience { min-height: 600px; }
      .planet-list { display: none; }
      .portal-wrap { top: 44%; width: min(260px, 66vw); }
      .planet-content { left: 18px; right: 18px; bottom: 18px; display: block; }
      .planet-content h1 { font-size: clamp(72px, 26vw, 130px); margin-bottom: 16px; }
      .planet-content dl { width: 100%; font-size: 13px; }
      .fact { grid-template-columns: 100px 1fr; padding: 5px 0; }
      .portal-heading { font-size: 13px; }
      .portal-heading strong { font-size: 15px; }
      .menu { height: 38px; padding: 0 16px; font-size: 12px; }
      .portal { border-radius: 70px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; }
      .portal { transform: none !important; }
    }
  </style>
</head>

    <!-- BACKGROUND VIDEOS -->

      <video id="saree-background" class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto" loop></video>

      <video id="men-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto" loop></video>

    <!-- PRELOADER -->

      <circle cx="50" cy="50" r="42" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="3,3"/>
      <path d="M 50 18 L 30 75 L 40 75 L 46 58 L 54 58 L 60 75 L 70 75 Z M 48 48 L 50 34 L 52 48 Z" fill="#D4AF37"/>

      <span id="preloader-value">0</span><span class="percent">%</span>

    <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>

    <!-- HEADER -->
    <header class="header chrome">
      <div class="brand-title">

        <button class="menu" type="button" onclick="travel()">Next Portal</button>
      </div>
    </header>

    <!-- SIDEBAR CATEGORIES -->

    <!-- 3D PORTAL CANVAS -->
    <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>

    <!-- PORTAL WRAPPER -->
    <section class="portal-wrap chrome" aria-label="Next destination">
      <div class="portal-heading">
        <span>Next Collection:</span>
        <span><span id="next-number">[02]</span> <strong id="next-name">Modern Style</strong></span>
      </div>
      <button class="portal" id="portal" type="button" aria-label="Travel to Modern Style">
        <video id="portal-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto" loop></video>
        <img id="portal-image" src="images/saree_tradition.jpg" alt="Fashion Collection">
      </button>
    </section>

    <!-- MAIN CONTENT -->
    <section class="planet-content chrome" aria-live="polite">
      <div>
        <div class="category-badge" id="category-badge">HERITAGE SILK WEAVES</div>
        <h1 id="planet-title">TRADITION</h1>
      </div>
      <dl id="facts"></dl>
    </section>

    <!-- TRANSITION VIDEO & CURSOR -->
    <div class="transition-layer" aria-hidden="true"><video id="transition-video" muted playsinline preload="auto"></video></div>
    <div class="loading" aria-hidden="true">Weaving next collection…</div>
    <div class="custom-cursor" aria-hidden="true">
      <span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Discover</span>
    </div>
  </main>

  <script>
    const planets = ['Tradition', 'Modern Style', 'Contemporary Men', 'Little Ones'];

    const states = {
      saree: {
        name: 'Tradition',
        badge: 'HERITAGE SILK WEAVES',
        next: 'Modern Style',
        nextKey: 'women',
        number: '[02]',
        image: 'images/saree_tradition.jpg',
        background: 'saree-background',
        facts: [
          ['Weave Origin:', 'Kanchipuram & Banarasi Zari Silk'],
          ['Purity:', '100% Pure Mulberry Silk & Real Gold Threads'],
          ['Craftsmanship:', 'Hand-woven by Master Artisan Weavers (60+ days)'],
          ['Occasion:', 'Bridal, Royal Heritage & Festive Celebrations']
        ]
      },
      women: {
        name: 'Modern Style',
        badge: 'CONTEMPORARY COUTURE',
        next: 'Contemporary Men',
        nextKey: 'men',
        number: '[03]',
        image: 'images/modern_women.jpg',
        background: 'women-background',
        facts: [
          ['Fabric:', 'Italian Wool Blend & Pure Silk Satin'],
          ['Fit:', 'Tailored Executive & Runway Silhouette'],
          ['Collection:', 'Spring-Autumn Executive & Eveningwear'],
          ['Design Note:', 'Sculpted collars, vibrant neon tones & precision cuts']
        ]
      },
      men: {
        name: 'Contemporary Men',
        badge: 'TAILORED MENSWEAR',
        next: 'Little Ones',
        nextKey: 'kids',
        number: '[04]',
        image: 'images/contemporary_men.jpg',
        background: 'men-background',
        facts: [
          ['Suiting:', 'Super 150s Merino Wool & Premium Cotton Linen'],
          ['Structure:', 'Unstructured Lightweight Blazers & Urban Jackets'],
          ['Versatility:', 'Desk-to-Dinner Smart Casual & Formal Wear'],
          ['Finish:', 'Wrinkle-resistant, breathable high-performance weaves']
        ]
      },
      kids: {
        name: 'Little Ones',
        badge: 'FAMILY & KIDS FASHION',
        next: 'Tradition',
        nextKey: 'saree',
        number: '[01]',
        image: 'images/kids_fashion.jpg',
        background: 'kids-background',
        facts: [
          ['Material:', '100% Organic Egyptian Cotton & Soft Muslin'],
          ['Safety:', 'Hypoallergenic, Non-toxic Organic Dyes'],
          ['Comfort:', 'Ultra-stretchable active seam construction'],
          ['Range:', 'Playwear, Festive Minis & Seasonal Outfits']
        ]
      }
    };

    let current = 'saree';
    let busy = false;
    let hasRendered = false;

    // Animation & Canvas State
    let targetX = 0, targetY = 0;
    let rotX = 0, rotY = 0;
    let expansion = 0;
    let maskScale = 1;
    let canvasOpacity = 1;
    let transitionActive = false;
    let hasFrozenScene = false;
    let lastTime = performance.now();

    // 3D Flying Silk Ribbon Particle Simulation
    const ribbons = Array.from({ length: 7 }, (_, i) => ({
      x: (Math.random() - 0.5) * window.innerWidth,
      y: (Math.random() - 0.5) * window.innerHeight,
      z: Math.random() * 800 - 400,
      length: 180 + Math.random() * 120,
      phase: Math.random() * Math.PI * 2,
      speed: 0.002 + Math.random() * 0.003,
      color: ['#D4AF37', '#8B0000', '#004B49', '#DAA520', '#C0C0C0'][i % 5]
    }));

    const portalCanvas = document.getElementById('portal-canvas');
    const portalCtx = portalCanvas.getContext('2d');
    const sceneCanvas = document.getElementById('scene-canvas');
    const sceneCtx = sceneCanvas.getContext('2d');
    const portalElem = document.getElementById('portal');

    const portalVideo = document.getElementById('portal-video');
    const portalImage = document.getElementById('portal-image');
    const transitionVideo = document.getElementById('transition-video');

    const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

    function resizeCanvas() {
      const d = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;

      portalCanvas.width = w * d;
      portalCanvas.height = h * d;
      portalCanvas.style.width = w + 'px';
      portalCanvas.style.height = h + 'px';
      portalCtx.setTransform(d, 0, 0, d, 0, 0);

      if (!hasFrozenScene) {
        sceneCanvas.width = w * d;
        sceneCanvas.height = h * d;
        sceneCanvas.style.width = w + 'px';
        sceneCanvas.style.height = h + 'px';
        sceneCtx.setTransform(d, 0, 0, d, 0, 0);
      }
    }
    window.addEventListener('resize', resizeCanvas);

    function pauseAndRewindBackgrounds() {
      document.querySelectorAll('.backgrounds .background').forEach(v => {
        v.pause();
        v.currentTime = 0;
      });
    }

    function selectPlanet(key) {
      if (busy || current === key) return;
      current = key;
      render();
      revealMask();
      revealPlanetContent();
    }

    function render() {
      const state = states[current];
      const experience = document.querySelector('.experience');
      const planetTitle = document.getElementById('planet-title');
      const categoryBadge = document.getElementById('category-badge');
      const nextName = document.getElementById('next-name');
      const nextNumber = document.getElementById('next-number');
      const portalBtn = document.getElementById('portal');
      const factsDl = document.getElementById('facts');
      const planetList = document.querySelector('.planet-list');

      experience.setAttribute('data-planet', current);
      planetTitle.textContent = state.name.toUpperCase();
      categoryBadge.textContent = state.badge;
      nextName.textContent = state.next;
      nextNumber.textContent = state.number;
      portalBtn.setAttribute('aria-label', `Travel to ${state.next}`);

      // Update Nav active links
      const navLinks = document.querySelectorAll('.nav a');
      navLinks.forEach(a => {
        if (a.textContent.trim().toUpperCase() === state.name.toUpperCase()) {
          a.classList.add('active');
        } else {
          a.classList.remove('active');
        }
      });

      // Build facts
      factsDl.innerHTML = state.facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join('');

      // Build planet-list
      planetList.innerHTML = planets.map(p => {
        const matchingKey = Object.keys(states).find(k => states[k].name === p);
        return `<span class="planet-item ${p === state.name ? 'active' : ''}" onclick="selectPlanet('${matchingKey}')">${p}</span>`;
      }).join('');

      if (hasRendered) {
        planetList.classList.remove('is-switching');
        void planetList.offsetWidth;
        planetList.classList.add('is-switching');
      }
      hasRendered = true;

      // Toggle background videos
      const bgVideos = document.querySelectorAll('.backgrounds .background');
      bgVideos.forEach(vid => {
        if (vid.id === state.background) {
          vid.classList.add('is-visible');
          const p = vid.play();
          if (p !== undefined) p.catch(() => {});
        } else {
          vid.classList.remove('is-visible');
        }
      });

      // Portal media visibility & image src
      if (state.image) {
        portalImage.style.display = 'block';
        portalVideo.style.display = 'none';
        portalImage.src = state.image;
      } else {
        portalImage.style.display = 'none';
        portalVideo.style.display = 'block';
        if (portalVideo.getAttribute('src') !== state.portal) {
          portalVideo.src = state.portal;
          portalVideo.load();
          const p = portalVideo.play();
          if (p !== undefined) p.catch(() => {});
        }
      }
    }

    function drawCover(ctx, media) {
      if (!media) return;
      if (media.tagName === 'VIDEO' && media.readyState < 2) return;
      if (media.tagName === 'IMG' && (!media.complete || media.naturalWidth === 0)) return;

      let mw = media.videoWidth || media.naturalWidth || 1000;
      let mh = media.videoHeight || media.naturalHeight || 1000;
      if (mw <= 0 || mh <= 0) return;

      const scale = Math.max(window.innerWidth / mw, window.innerHeight / mh);
      const w = mw * scale;
      const h = mh * scale;
      try {
        ctx.drawImage(media, (window.innerWidth - w) / 2, (window.innerHeight - h) / 2, w, h);
      } catch (e) {
        // Catch frame draw exception
      }
    }

    function drawShade(ctx) {
      const grad = ctx.createLinearGradient(0, window.innerHeight * 0.52, 0, window.innerHeight);
      grad.addColorStop(0, 'rgba(8,7,6,0)');
      grad.addColorStop(1, 'rgba(8,7,6,0.92)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, window.innerHeight * 0.52, window.innerWidth, window.innerHeight * 0.48);
    }

    // 3D Flying Silk Ribbon Background Simulation
    function draw3DSilkRibbons(ctx, now) {
      ctx.save();
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const focal = 800;

      ribbons.forEach(r => {
        r.phase += r.speed;
        ctx.beginPath();
        ctx.strokeStyle = r.color;
        ctx.lineWidth = 4 * (focal / (focal + r.z));
        ctx.globalAlpha = 0.25 * (focal / (focal + r.z));

        const steps = 30;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const currZ = r.z + (t - 0.5) * 100;
          const p = focal / (focal + currZ);

          const waveX = Math.sin(r.phase + t * Math.PI * 3) * 60;
          const waveY = Math.cos(r.phase * 0.8 + t * Math.PI * 2) * 80;

          const sx = cx + (r.x + t * r.length + waveX) * p;
          const sy = cy + (r.y + waveY) * p;

          if (i === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        ctx.stroke();
      });
      ctx.restore();
    }

    function generateProjectedPoints(w, h, r, rx, ry, cx, cy) {
      r = Math.min(r, w / 2, h / 2);
      const corners = [
        { cx: w / 2 - r,  cy: -h / 2 + r, start: -Math.PI / 2, end: 0 },
        { cx: w / 2 - r,  cy: h / 2 - r,  start: 0,            end: Math.PI / 2 },
        { cx: -w / 2 + r, cy: h / 2 - r,  start: Math.PI / 2,   end: Math.PI },
        { cx: -w / 2 + r, cy: -h / 2 + r, start: Math.PI,        end: Math.PI * 1.5 }
      ];

      const points = [];
      const ax = rx * Math.PI / 180;
      const ay = ry * Math.PI / 180;
      const cosAx = Math.cos(ax), sinAx = Math.sin(ax);
      const cosAy = Math.cos(ay), sinAy = Math.sin(ay);
      const focal = 850;

      for (let c = 0; c < 4; c++) {
        const corner = corners[c];
        const steps = 10;
        for (let i = 0; i <= steps; i++) {
          const angle = corner.start + (corner.end - corner.start) * (i / steps);
          const x = corner.cx + r * Math.cos(angle);
          const y = corner.cy + r * Math.sin(angle);

          const xx = x * cosAy;
          const yy = y * cosAx;
          const z = x * sinAy - y * sinAx;
          const p = focal / (focal + z);

          points.push([cx + xx * p, cy + yy * p]);
        }
      }

      return points;
    }

    window.addEventListener('pointermove', (e) => {
      if (isTouch || busy) return;
      targetY = (e.clientX / window.innerWidth - 0.5) * 37.4;
      targetX = (e.clientY / window.innerHeight - 0.5) * -33;
    });

    window.addEventListener('pointerleave', () => {
      targetX = 0;
      targetY = 0;
    });

    function draw(now) {
      const dt = Math.min(40, now - lastTime);
      lastTime = now;

      if (!isTouch && !busy) {
        rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
        rotY += (targetY - rotY) * Math.min(1, dt * 0.009);
      } else {
        rotX += (0 - rotX) * Math.min(1, dt * 0.009);
        rotY += (0 - rotY) * Math.min(1, dt * 0.009);
      }

      portalCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      // Render 3D Flying Silk Ribbons
      draw3DSilkRibbons(portalCtx, now);

      if (hasFrozenScene) {
        portalCtx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
        drawShade(portalCtx);
      }

      const rect = portalElem.getBoundingClientRect();
      const e = expansion;

      const rectCx = rect.left + rect.width / 2;
      const rectCy = rect.top + rect.height / 2;

      const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
      const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;

      const baseW = rect.width + (window.innerWidth - rect.width) * e;
      const baseH = rect.height + (window.innerHeight - rect.height) * e;

      const scale = e ? 1 : maskScale;
      const w = baseW * scale;
      const h = baseH * scale;

      const r = 90 * (1 - e) * scale;
      const rx = rotX * (1 - e);
      const ry = rotY * (1 - e);

      if (w > 1 && h > 1) {
        const pts = generateProjectedPoints(w, h, r, rx, ry, cx, cy);
        portalCtx.save();
        portalCtx.globalAlpha = canvasOpacity;
        portalCtx.beginPath();
        portalCtx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) {
          portalCtx.lineTo(pts[i][0], pts[i][1]);
        }
        portalCtx.closePath();
        portalCtx.clip();

        portalCtx.fillStyle = '#080706';
        portalCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        const mediaToDraw = transitionActive ? transitionVideo : (states[current].image ? portalImage : portalVideo);
        drawCover(portalCtx, mediaToDraw);

        if (transitionActive) {
          drawShade(portalCtx);
        }

        portalCtx.restore();
      }

      requestAnimationFrame(draw);
    }

    function animateValue(setter, duration) {
      return new Promise((resolve) => {
        const startTime = performance.now();
        function tick(now) {
          const elapsed = now - startTime;
          const t = Math.min(1, elapsed / duration);
          const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          setter(eased);
          if (t < 1) {
            requestAnimationFrame(tick);
          } else {
            resolve();
          }
        }
        requestAnimationFrame(tick);
      });
    }

    function revealMask() {
      const experience = document.querySelector('.experience');
      experience.classList.remove('mask-revealing');
      void experience.offsetWidth;
      experience.classList.add('mask-revealing');
      maskScale = 0;
      return animateValue(v => { maskScale = v; }, 1050);
    }

    function revealPlanetContent() {
      const experience = document.querySelector('.experience');
      experience.classList.remove('content-revealing');
      void experience.offsetWidth;
      experience.classList.add('content-revealing');
    }

    async function travel() {
      if (busy) return;
      busy = true;
      targetX = 0;
      targetY = 0;

      const nextKey = states[current].nextKey;
      const experience = document.querySelector('.experience');

      try {
        transitionVideo.src = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4';
        transitionVideo.load();
        experience.classList.add('is-loading');

        await new Promise((resolve) => {
          let done = false;
          const finish = () => {
            if (done) return;
            done = true;
            transitionVideo.removeEventListener('canplaythrough', finish);
            transitionVideo.removeEventListener('error', finish);
            resolve();
          };
          transitionVideo.addEventListener('canplaythrough', finish);
          transitionVideo.addEventListener('error', finish);
          setTimeout(finish, 1600);
        });

        experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
        experience.classList.add('is-transitioning');

        transitionVideo.currentTime = 0;
        transitionVideo.playbackRate = 1.3;
        canvasOpacity = 1;
        transitionActive = true;

        const p = transitionVideo.play();
        if (p !== undefined) p.catch(() => {});

        await animateValue(v => { expansion = v; }, 1100);

        await new Promise((resolve) => {
          if (transitionVideo.ended) return resolve();
          const onEnded = () => {
            transitionVideo.removeEventListener('ended', onEnded);
            resolve();
          };
          transitionVideo.addEventListener('ended', onEnded);
          setTimeout(resolve, Math.max(500, (transitionVideo.duration - transitionVideo.currentTime) * 1000 / 1.3 + 500) || 3000);
        });

        sceneCanvas.width = portalCanvas.width;
        sceneCanvas.height = portalCanvas.height;
        sceneCanvas.style.display = 'block';
        const d = Math.min(window.devicePixelRatio || 1, 2);
        sceneCtx.setTransform(d, 0, 0, d, 0, 0);
        sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        drawCover(sceneCtx, transitionVideo);
        hasFrozenScene = true;

        current = nextKey;
        experience.classList.add('is-committing');
        render();

        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        transitionActive = false;
        expansion = 0;
        maskScale = 0;
        canvasOpacity = 1;

        experience.classList.remove('is-transitioning', 'is-committing');
        sceneCanvas.style.display = 'none';
        hasFrozenScene = false;

        const maskReveal = revealMask();
        setTimeout(() => {
          revealPlanetContent();
        }, 100);

        await maskReveal;

        setTimeout(() => {
          transitionVideo.removeAttribute('src');
          transitionVideo.load();
          busy = false;
        }, 450);

      } catch (err) {
        console.error(err);
        transitionActive = false;
        expansion = 0;
        maskScale = 1;
        canvasOpacity = 1;
        experience.classList.remove('is-loading', 'is-transitioning', 'is-committing');
        sceneCanvas.style.display = 'none';
        hasFrozenScene = false;
        busy = false;
      }
    }

    portalElem.addEventListener('click', travel);

    // CUSTOM CURSOR
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let orbitX = mouseX;
    let orbitY = mouseY;
    let cursorVisible = false;

    const customCursor = document.querySelector('.custom-cursor');
    const cursorDot = document.querySelector('.cursor-dot');
    const cursorOrbit = document.querySelector('.cursor-orbit');
    const cursorLabel = document.querySelector('.cursor-label');

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!cursorVisible) {
        cursorVisible = true;
        customCursor.classList.add('is-visible');
        orbitX = mouseX;
        orbitY = mouseY;
      }
    });

    document.addEventListener('mouseleave', () => {
      cursorVisible = false;
      customCursor.classList.remove('is-visible');
    });

    portalElem.addEventListener('pointerenter', () => {
      customCursor.classList.add('is-enter');
    });

    portalElem.addEventListener('pointerleave', () => {
      customCursor.classList.remove('is-enter');
    });

    function cursorLoop() {
      if (cursorVisible) {
        orbitX += (mouseX - orbitX) * 0.2;
        orbitY += (mouseY - orbitY) * 0.2;

        cursorDot.style.left = mouseX + 'px';
        cursorDot.style.top = mouseY + 'px';

        cursorOrbit.style.left = orbitX + 'px';
        cursorOrbit.style.top = orbitY + 'px';

        cursorLabel.style.left = orbitX + 'px';
        cursorLabel.style.top = orbitY + 'px';
      }
      requestAnimationFrame(cursorLoop);
    }

    function ensureMediaReady(media) {
      return new Promise(resolve => {
        if (!media) return resolve();
        if (media.tagName === 'IMG') {
          if (media.complete && media.naturalWidth > 0) return resolve();
          media.onload = resolve;
          media.onerror = resolve;
        } else {
          if (media.readyState >= 2) return resolve();
          const onReady = () => {
            media.removeEventListener('loadeddata', onReady);
            media.removeEventListener('canplay', onReady);
            media.removeEventListener('error', onReady);
            resolve();
          };
          media.addEventListener('loadeddata', onReady);
          media.addEventListener('canplay', onReady);
          media.addEventListener('error', onReady);
          setTimeout(resolve, 1200);
        }
      });
    }

    async function startExperience() {
      const currentPortalMedia = states[current].image ? portalImage : portalVideo;
      await ensureMediaReady(currentPortalMedia);
      await revealMask();
      document.body.classList.add('intro-ready');
      setTimeout(() => {
        revealPlanetContent();
      }, 850);
    }

    function runPreloader() {
      const preloaderVideo = document.getElementById('preloader-video');
      const preloaderCount = document.getElementById('preloader-count');
      const preloaderVal = document.getElementById('preloader-value');
      const preloaderSub = document.getElementById('preloader-subtext');
      const logo = document.getElementById('floating-logo');
      const preloader = document.getElementById('preloader');

      let finished = false;

      const subtexts = [
        "Experience the elegance of timeless tradition",
        "Step into modern style with contemporary couture",
        "Crafted for the contemporary man of distinction",
        "Fun and comfort for the little ones",
        "ANDAHA — Your complete family fashion"
      ];

      function finishPreloader() {
        if (finished) return;
        finished = true;
        preloaderVal.textContent = '100';
        preloaderCount.classList.add('is-leaving');
        logo.classList.add('is-docked');
        preloader.classList.add('is-background');
        document.body.classList.add('preload-complete');

        startExperience();

        setTimeout(() => {
          if (preloaderCount.parentNode) preloaderCount.remove();
        }, 750);

        setTimeout(() => {
          logo.classList.add('is-settled');
        }, 2000);
      }

      function updateCount() {
        if (finished) return;
        if (preloaderVideo.duration && preloaderVideo.duration > 0) {
          const pct = Math.min(100, Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100));
          preloaderVal.textContent = pct;

          // Rotate subtitles based on preloader playback percentage
          const subIdx = Math.min(subtexts.length - 1, Math.floor((pct / 100) * subtexts.length));
          if (preloaderSub.textContent !== subtexts[subIdx]) {
            preloaderSub.style.opacity = '0';
            setTimeout(() => {
              preloaderSub.textContent = subtexts[subIdx];
              preloaderSub.style.opacity = '1';
            }, 150);
          }
        }
        if (!preloaderVideo.ended && !finished) {
          requestAnimationFrame(updateCount);
        }
      }

      function startVideo() {
        if (preloaderVideo.duration) {
          preloaderVideo.playbackRate = Math.max(0.25, preloaderVideo.duration / 3);
        }
        const playPromise = preloaderVideo.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            requestAnimationFrame(updateCount);
          }).catch(() => {
            finishPreloader();
          });
        } else {
          requestAnimationFrame(updateCount);
        }
      }

      preloaderVideo.addEventListener('ended', finishPreloader);
      preloaderVideo.addEventListener('error', finishPreloader);

      if (preloaderVideo.readyState >= 1) {
        startVideo();
      } else {
        preloaderVideo.addEventListener('loadedmetadata', startVideo);
      }

      setTimeout(() => {
        if (!finished) {
          finishPreloader();
        }
      }, 3500);
    }

    // Boot Order
    pauseAndRewindBackgrounds();
    resizeCanvas();
    render();
    requestAnimationFrame(draw);
    requestAnimationFrame(cursorLoop);
    runPreloader();
  </script>
</body>
