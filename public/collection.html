<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collection — ANDAHA</title>
  <meta name="description" content="Shop the ANDAHA collection.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fredoka:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body class="collection">

  <header class="c-header" id="cHeader">
    <a href="/" class="brand"><span data-emblem></span><span class="brand__name">ANDAHA</span></a>
    <nav class="c-nav" id="cNav" aria-label="Collections"></nav>
    <a class="c-wa" id="cWa" href="#" target="_blank" rel="noopener" hidden><i data-icon="whatsapp"></i><span>Order on WhatsApp</span></a>
  </header>

  <section class="c-hero" id="hero">
    <div class="c-hero__media" id="heroMedia"></div>
    <div class="c-hero__shade"></div>
    <div class="c-hero__copy">
      <p class="crumbs"><a href="/">Home</a> <span>/</span> <span id="crumb">Collection</span></p>
      <p class="eyebrow" id="cBadge"></p>
      <h1 class="c-title" id="cTitle"></h1>
      <p class="c-intro" id="cIntro"></p>
      <a href="#shop" class="c-scroll" id="cScroll"><span id="cCount"></span><i data-icon="arrow"></i></a>
    </div>
  </section>

  <section class="shop" id="shop">
    <div class="toolbar" id="toolbar">
      <div class="chips" id="chips" role="tablist" aria-label="Filter"></div>
      <div class="toolbar__right">
        <label class="search"><span class="sr-only">Search</span><input id="q" type="search" placeholder="Search this collection"></label>
        <label class="sort"><span class="sr-only">Sort</span>
          <select id="sort">
            <option value="featured">Featured</option>
            <option value="new">Newest</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
          </select>
        </label>
      </div>
    </div>
    <p class="result-count" id="resultCount" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <h2>New pieces arriving soon</h2>
      <p>Nothing matches yet. Try another filter, or message us and we'll share what's in store.</p>
    </div>
  </section>

  <section class="more" id="more">
    <p class="eyebrow">Keep exploring</p>
    <div class="more__grid" id="moreGrid"></div>
  </section>

  <footer class="footer" id="footer"></footer>

  <!-- product quick view -->
  <div class="qv" id="qv" hidden role="dialog" aria-modal="true" aria-labelledby="qvName">
    <div class="qv__backdrop" data-close></div>
    <div class="qv__panel">
      <button class="qv__close" data-close aria-label="Close">×</button>
      <div class="qv__gallery">
        <div class="qv__main"><img id="qvImg" alt=""></div>
        <div class="qv__thumbs" id="qvThumbs"></div>
      </div>
      <div class="qv__info">
        <p class="eyebrow" id="qvType"></p>
        <h2 id="qvName"></h2>
        <p class="qv__price" id="qvPrice"></p>
        <p class="qv__fabric" id="qvFabric"></p>
        <p class="qv__desc" id="qvDesc"></p>
        <div class="qv__sizes" id="qvSizesWrap"><p class="label">Size</p><div class="sizes" id="qvSizes"></div></div>
        <a class="btn btn--order" id="qvOrder" href="#" target="_blank" rel="noopener"><i data-icon="whatsapp"></i><span>Order on WhatsApp</span></a>
        <p class="qv__note" id="qvNote"></p>
      </div>
    </div>
  </div>

  <script src="/vendor/gsap.min.js"></script>
  <script src="/vendor/ScrollTrigger.min.js"></script>
  <script src="/vendor/lenis.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/collection.js"></script>
</body>
</html>
